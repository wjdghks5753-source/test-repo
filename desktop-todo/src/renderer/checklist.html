<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;" />
  <title>오늘 할 일</title>
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="checklist.css" />
</head>
<body>
  <header class="titlebar">
    <div>
      <h1>오늘 할 일</h1>
      <div class="date" id="dateLabel"></div>
    </div>
    <div class="spacer"></div>
    <div class="winbtns">
      <button class="iconbtn" id="syncBtn" title="지금 동기화">⟳</button>
      <button class="iconbtn" id="settingsBtn" title="설정">⚙</button>
      <button class="iconbtn danger" id="hideBtn" title="트레이로 숨기기">✕</button>
    </div>
  </header>

  <section class="progress">
    <div class="bar"><div class="fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">불러오는 중…</div>
  </section>

  <section class="composer">
    <div class="composer-row">
      <input class="field" id="newTitle" placeholder="할 일 추가 후 Enter" autocomplete="off" />
      <button class="btn primary" id="addBtn">추가</button>
    </div>
    <div class="composer-row sub">
      <input class="field" id="newTime" type="time" title="마감 시각 (비워두면 종일)" />
      <select class="field" id="newCategory" title="분류">
        <option value="">분류 없음</option>
        <option>스터디</option>
        <option>업무</option>
        <option>환자</option>
        <option>연구</option>
        <option>개인</option>
      </select>
    </div>
  </section>

  <main class="scroll" id="list"></main>

  <footer class="statusbar">
    <span id="statusText">—</span>
    <div class="spacer"></div>
    <span id="pendingText"></span>
  </footer>

  <script src="checklist.js"></script>
</body>
</html>
